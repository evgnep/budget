[libraries]
android-core-ktx = { module = "androidx.core:core-ktx", version = "1.13.1" }
android-activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
android-compose-bom = { module = "androidx.compose:compose-bom", version = "2024.12.01" }
android-compose-ui = { module = "androidx.compose.ui:ui" }
android-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
android-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
android-compose-material3 = { module = "androidx.compose.material3:material3" }

atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version = "2.0.1" }

dagger-lib = { module = "com.google.dagger:dagger", version.ref = "dagger"}
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger"}

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

flyway-core = { module = "org.flywaydb:flyway-core", version = "11.4.0" }

fx-controls = { module = "org.controlsfx:controlsfx", version = "11.2.2" }
fx-validation = { module = "net.synedra:validatorfx", version = "0.6.1"}

jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.6.2" }
kotlin-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinSerialization" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.1" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.10.1" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }

ktorm-core = { module = "org.ktorm:ktorm-core", version.ref = "ktorm" }
ktorm-sqlite = { module = "org.ktorm:ktorm-support-sqlite", version.ref = "ktorm" }

logging-logback = { module = "ch.qos.logback:logback-classic", version = "1.5.17" }
logging-kotlin = { module = "io.github.oshai:kotlin-logging-jvm", version = "7.0.4" }

sqlite = { module = "org.xerial:sqlite-jdbc", version = "3.49.1.0" }

# MS Access driver
ucanaccess = { module = "io.github.spannm:ucanaccess", version = "5.1.3" }

## Test
test-assertj = { module = "org.assertj:assertj-core", version = "3.27.3" }
test-jsonunit = { module = "net.javacrumbs.json-unit:json-unit-assertj", version = "4.1.0" }
test-junit5 = { module = "org.junit.jupiter:junit-jupiter", version = "5.12.0" }
test-junit5-platform = { module = "org.junit.platform:junit-platform-launcher", version = "1.12.0" }
test-mockk-jvm = { module = "io.mockk:mockk-jvm", version = "1.13.17" }

[versions]
dagger = "2.60.1"
jackson = "2.18.3"
javafx = "21"
jdk = "21"
kotlinSerialization = "1.8.0"
ktor = "3.5.0"
ktorm = "4.1.1"
room = "2.8.4"

[bundles]
test-junit5 = ["test-junit5", "test-junit5-platform", "test-assertj", "test-jsonunit", "test-mockk-jvm"]

[plugins]
android-application = { id = "com.android.application" }
android-library = { id = "com.android.library" }
kotlin-android = { id = "org.jetbrains.kotlin.android" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose" }
moduleplugin = { id = "org.javamodularity.moduleplugin", version = "1.8.12" }
javafxplugin = { id = "org.openjfx.javafxplugin", version = "0.0.13" }
jlink = { id = "org.beryx.jlink", version = "3.1.1" }
runtime = { id = "org.beryx.runtime", version = "1.13.1" }
